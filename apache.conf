<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# Send Apache + PHP logs to the container's stderr so they show up in
# `docker compose logs`. Without this they go to files under /var/log/apache2,
# which is a tmpfs mount here — wiped on restart and never seen by Docker.
# This overrides the main-server ErrorLog; the per-vhost one is redirected in
# the Dockerfile (sites-available/000-default.conf).
ErrorLog /dev/stderr

# ── Real client IP behind a reverse proxy ──────────────────────────────────
# With Caddy (and CrowdSec) in front, every connection arrives from the proxy,
# so without this the access log records the proxy's address on every line and
# a ban decision would target the proxy itself. mod_remoteip rewrites the
# connection's client address from X-Forwarded-For, which fixes both the access
# log (%h) and $_SERVER['REMOTE_ADDR'] in PHP at once.
#
# It only does that for connections that came from a proxy we trust. That list
# is generated into /var/run/apache2/remoteip.conf by docker-entrypoint.sh from
# the TRUSTED_PROXIES env var — the root filesystem is read-only, so it has to
# be written to one of the tmpfs mounts. IncludeOptional means a missing file
# is not an error: Apache starts and simply ignores X-Forwarded-For, which is
# the safe direction to fail (a forged header can never be believed).
<IfModule mod_remoteip.c>
    RemoteIPHeader X-Forwarded-For
    IncludeOptional /var/run/apache2/remoteip.conf
</IfModule>

# Defense in depth: never serve source, schema, secrets, or scripts even if
# they end up in the web root. The .dockerignore keeps most of these out of the
# image; this blocks the rest at the HTTP layer.
<FilesMatch "\.(sql|md|env|sh|conf|example|ini|lock|json|yml|yaml)$">
    Require all denied
</FilesMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

