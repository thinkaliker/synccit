# Test-only overlay for tests/smoke.py: adds a mailpit SMTP sink so password
# reset email is exercised end to end. Never use this for a real deployment.
#
#   docker compose -p synccit-smoke -f docker-compose.yml \
#       -f tests/docker-compose.smoke.yml --profile internal-db up -d --wait
services:
  synccit:
    environment:
      SMTP_SERVER: mailpit
      SMTP_PORT: "1025"
      SMTP_ENC: none
      SMTP_USER: smoke
      SMTP_PASS: smoke
      FROM_EMAIL: noreply@example.invalid
    depends_on:
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      # config.php always authenticates, so accept any credentials over plain SMTP
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"
